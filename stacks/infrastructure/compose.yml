services:

  watchtower:
    container_name: watchtower
    labels:
      glance.name: "Watchtower"
      glance.icon: "si:watchtower"
      glance.description: "Auto Updates"
      glance.category: "infrastructure"
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      - WATCHTOWER_SCHEDULE=0 30 10 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  glance:
    container_name: glance
    image: glanceapp/glance:latest
    restart: unless-stopped
    labels:
      glance.name: "Glance"
      glance.icon: "sh:glance"
      glance.description: "Dashboard"
      glance.category: "infrastructure"
      glance.url: "http://${LAN_IP}:8090"
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    env_file:
      - .env
    volumes:
      - ../../config/glance/config:/app/config:ro
      - ../../config/glance/assets:/app/assets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8090:8080"

  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:s6
    labels:
      glance.name: "FileBrowser"
      glance.icon: "di:filebrowser"
      glance.description: "File Management"
      glance.category: "infrastructure"
      glance.url: "http://${LAN_IP}:8095"
    restart: unless-stopped
    ports:
      - "8095:8080"
    volumes:
      - /volume1/docker/appdata:/srv
      - ${DOCKERCONFDIR}/filebrowser/database:/database
      # Not :ro: the s6 image chowns its mounts at startup and exits on a read-only one.
      - ../../config/filebrowser/config:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
