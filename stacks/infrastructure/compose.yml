x-logging: &logging
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

services:

  glance:
    container_name: glance
    image: glanceapp/glance:v0.8.6
    restart: unless-stopped
    labels:
      glance.name: "Glance"
      glance.id: "glance"
      glance.icon: "sh:glance"
      glance.description: "Dashboard"
      glance.category: "infrastructure"
      glance.url: "http://${LAN_IP}:8090"
    logging: *logging
    env_file:
      - ../common.env
      - .env
    volumes:
      - ../../config/glance/config:/app/config:ro
      - ../../config/glance/assets:/app/assets:ro
    ports:
      - "8090:8080"

  # Read-only Docker API for Glance's container list. Whoever holds the Docker
  # socket is root on the server, so Glance never gets it directly.
  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    labels:
      glance.name: "Docker Socket Proxy"
      glance.icon: "si:docker"
      glance.description: "Read-only Docker API for Glance"
      glance.category: "infrastructure"
      glance.parent: "glance"
    logging: *logging
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Serves backups.json, written hourly by scripts/backup_status.sh, to Glance's Backups widget.
  # No published port: Glance reaches it on this stack's network, and nobody else needs it.
  backup-status:
    container_name: backup-status
    image: joseluisq/static-web-server:2.44.0
    restart: unless-stopped
    labels:
      glance.name: "Backup status"
      glance.icon: "sh:restic.png"
      glance.description: "Backup numbers for Glance"
      glance.category: "infrastructure"
      glance.parent: "glance"
    logging: *logging
    environment:
      # IPv4: the default, "::", needs IPv6, which Docker leaves off in containers on this network.
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_ROOT=/public
    volumes:
      - ${DOCKERCONFDIR}/backup-status:/public:ro

  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:v2.63.23-s6
    labels:
      homelab.backup: "bolt"
      glance.name: "FileBrowser"
      glance.icon: "di:filebrowser"
      glance.description: "File Management"
      glance.category: "infrastructure"
      glance.url: "http://${LAN_IP}:8095"
    restart: unless-stopped
    logging: *logging
    ports:
      - "8095:8080"
    volumes:
      - ${FILEBROWSER_ROOT}:/srv
      - ${DOCKERCONFDIR}/filebrowser/database:/database
      # Not :ro: the s6 image chowns its mounts at startup and exits on a read-only one.
      - ../../config/filebrowser/config:/config
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
