x-logging: &logging
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.45.0
    labels:
      glance.name: Portainer
      glance.icon: di:portainer
      glance.url: https://${LAN_IP}:9443
      glance.description: Docker Management
      glance.category: system
    restart: unless-stopped
    logging: *logging
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKERCONFDIR}/portainer:/data
    ports:
      # HTTPS only: port 9000 served the same UI, logins included, over plain HTTP.
      - "9443:9443"
