x-logging: &logging
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

services:
  # A tailnet node of its own. Traefik runs in its network namespace, so port 443 here is not
  # the NAS's port 443 (DSM's), and only the tailnet can reach it.
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:v1.102.5
    hostname: jeancloud-proxy
    labels:
      # Backup: the node's identity is a plain file.
      homelab.backup: "none"
      glance.name: "Tailscale"
      glance.icon: "sh:tailscale"
      glance.description: "Private path to the reverse proxy"
      glance.category: "infrastructure"
      glance.parent: "traefik"
    restart: unless-stopped
    logging: *logging
    # A real network interface for the tailnet, not userspace networking, which hands every
    # connection over from 127.0.0.1: AdGuard Home and Traefik then see which device is asking.
    # It needs DSM's tun module loaded (`lsmod | grep -w tun`): without /dev/net/tun the
    # container doesn't start.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=jeancloud-proxy
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ${DOCKERCONFDIR}/tailscale:/var/lib/tailscale:rw
    ports:
      # Traefik's `public` entrypoint: the router forwards WAN 443 here. The `tailnet` one (443)
      # is never published.
      - "8444:8444"
      # AdGuard Home's DNS, for the devices at home that are pointed at the NAS by hand. The
      # tailnet reaches it on this node's own address, which needs no published port.
      - "53:53/tcp"
      - "53:53/udp"
      # AdGuard Home's interface: what the proxy route and Gatus reach.
      - "8053:80"
      # AdGuard Home's setup wizard, which only listens until it has been completed once.
      - "8054:3000"

  traefik:
    container_name: traefik
    image: traefik:v3.7.14
    labels:
      # Backup: the certificates are a plain file, and Let's Encrypt issues them again.
      homelab.backup: "none"
      glance.name: "Traefik"
      glance.id: "traefik"
      glance.icon: "sh:traefik"
      glance.description: "Reverse Proxy"
      glance.category: "infrastructure"
    restart: unless-stopped
    logging: *logging
    depends_on:
      - tailscale
    network_mode: service:tailscale
    command:
      # `tailnet` is the default entrypoint: a router that names none stays private instead of
      # landing on every entrypoint, `public` included.
      - --entrypoints.tailnet.address=:443
      - --entrypoints.tailnet.asdefault=true
      - --entrypoints.tailnet.http.tls.certresolver=letsencrypt
      - --entrypoints.tailnet.http.tls.domains[0].main=*.${PROXY_DOMAIN}
      # Traefik gives a request 60 seconds to arrive whole, which cuts a long upload short
      # (a video to Immich, a large file to Filebrowser).
      - --entrypoints.tailnet.transport.respondingtimeouts.readtimeout=600s
      - --entrypoints.tailnet.transport.respondingtimeouts.idletimeout=600s
      - --entrypoints.public.address=:8444
      - --entrypoints.public.http.tls.certresolver=letsencrypt
      - --entrypoints.public.http.tls.domains[0].main=*.${PROXY_DOMAIN}
      - --providers.file.filename=/etc/traefik/dynamic/routes.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      # DNS challenge: the certificate needs no port open to the internet, and one wildcard
      # covers every route without listing their names in the public certificate logs.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
    environment:
      - TZ=${TZ}
      - PROXY_DOMAIN=${PROXY_DOMAIN}
      - LAN_IP=${LAN_IP}
      # Required: left empty, the route would go to port 80, which is DSM's own page.
      - OPUSLINE_PORT=${OPUSLINE_PORT:?set it with scripts/edit_env.sh proxy}
      # Required: left empty, the challenge fails and Traefik serves its own self-signed certificate.
      - CF_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:?set it with scripts/edit_env.sh proxy}
    volumes:
      - ../../config/traefik:/etc/traefik/dynamic:ro
      - ${DOCKERCONFDIR}/traefik:/acme:rw

  # DNS that blocks ads and trackers. In the tailscale container's network namespace, like
  # Traefik: the tailnet can then use this node's address as its DNS server (Tailscale admin
  # console, DNS). The ports the NAS publishes for it are on the tailscale service.
  adguardhome:
    container_name: adguardhome
    image: adguard/adguardhome:v0.107.79
    labels:
      # Backup: the settings are a plain file. The query log and the statistics are not worth keeping.
      homelab.backup: "none"
      glance.name: "AdGuard Home"
      glance.icon: "sh:adguard-home"
      glance.description: "DNS ad blocking"
      glance.category: "infrastructure"
      glance.parent: "traefik"
      glance.url: "https://adguard.${PROXY_DOMAIN}"
    restart: unless-stopped
    logging: *logging
    depends_on:
      - tailscale
    network_mode: service:tailscale
    environment:
      - TZ=${TZ}
    volumes:
      # Not in config/: AdGuard Home rewrites its settings file, which holds the login's password hash.
      - ${DOCKERCONFDIR}/adguardhome/conf:/opt/adguardhome/conf:rw
      - ${DOCKERCONFDIR}/adguardhome/work:/opt/adguardhome/work:rw

  # Keeps the DNS record of the `plex` route, the only public one, on the home's public address,
  # which the internet provider can change.
  ddns-updater:
    container_name: ddns-updater
    image: qmcgaw/ddns-updater:v2.10.0
    labels:
      glance.name: "DDNS Updater"
      glance.icon: "sh:ddns-updater"
      glance.description: "Public address of the plex route"
      glance.category: "infrastructure"
      glance.parent: "traefik"
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: ${TZ}
      # Its web UI has no use here: no port is published.
      SERVER_ENABLED: "no"
      # No /updater/data volume: all a restart loses is the history of past addresses.
      # proxied false: Traefik serves the TLS itself, and Plex would not work through Cloudflare's proxy.
      # ttl 1 is Cloudflare's "automatic".
      CONFIG: '{"settings":[{"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID:?set it with scripts/edit_env.sh proxy}","domain":"plex.${PROXY_DOMAIN}","ttl":1,"token":"${CLOUDFLARE_DNS_API_TOKEN:?set it with scripts/edit_env.sh proxy}","ip_version":"ipv4","proxied":false}]}'
