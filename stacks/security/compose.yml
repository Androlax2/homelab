x-logging: &logging
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

services:
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:1.37.3
    labels:
      homelab.backup: "sqlite"
      glance.name: "Vaultwarden"
      glance.icon: "sh:vaultwarden"
      glance.description: "Password Manager"
      glance.category: "security"
      # The proxy URL, not http://${LAN_IP}:8580: the web vault needs HTTPS, and fetches
      # attachments from DOMAIN, which the browser refuses from any other address.
      glance.url: "${VAULTWARDEN_DOMAIN}"
    restart: unless-stopped
    logging: *logging
    environment:
      - TZ=${TZ}
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SHOW_PASSWORD_HINT=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - WEB_VAULT_ENABLED=true
      - SENDS_ALLOWED=false
      - EMERGENCY_ACCESS_ALLOWED=false
      # All required: Vaultwarden refuses to start on an empty SMTP value. Compose refusing
      # first leaves the running vault as it is.
      - SMTP_HOST=${VAULTWARDEN_SMTP_HOST:?set it with scripts/edit_env.sh security}
      - SMTP_PORT=${VAULTWARDEN_SMTP_PORT:?set it with scripts/edit_env.sh security}
      - SMTP_SECURITY=${VAULTWARDEN_SMTP_SECURITY:?set it with scripts/edit_env.sh security}
      - SMTP_USERNAME=${VAULTWARDEN_SMTP_USERNAME:?set it with scripts/edit_env.sh security}
      - SMTP_PASSWORD=${VAULTWARDEN_SMTP_PASSWORD:?set it with scripts/edit_env.sh security}
      - SMTP_FROM=${VAULTWARDEN_SMTP_FROM:?set it with scripts/edit_env.sh security}
    volumes:
      - ${DOCKERCONFDIR}/vaultwarden:/data:rw
    ports:
      - "8580:80"
