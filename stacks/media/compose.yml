x-logging: &logging
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

services:

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.30.1
    container_name: maintainerr
    user: "${PUID}:${PGID}"
    network_mode: host
    labels:
      homelab.backup: "sqlite"
      glance.name: "Maintainerr"
      glance.icon: "sh:maintainerr"
      glance.description: "Maintainerr"
      glance.category: "media"
      glance.url: "https://maintainerr.${PROXY_DOMAIN}"
    logging: *logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/maintainerr:/opt/data
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.18.2-ls246
    labels:
      homelab.backup: "sqlite"
      glance.name: "Tautulli"
      glance.icon: "sh:tautulli"
      glance.description: "Plex Analytics"
      glance.category: "media"
      glance.url: "https://tautulli.${PROXY_DOMAIN}"
    container_name: tautulli
    network_mode: host
    logging: *logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/tautulli:/config
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    init: true
    user: "${PUID}:${PGID}"
    labels:
      homelab.backup: "sqlite"
      glance.name: "Seerr"
      glance.icon: "sh:overseerr"
      glance.description: "Media Requests"
      glance.category: "media"
      glance.url: "https://seerr.${PROXY_DOMAIN}"
    container_name: seerr
    network_mode: host
    logging: *logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/seerr:/app/config
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  qbittorrent:
    container_name: qbittorrent
    image: binhex/arch-qbittorrentvpn:5.2.4-1-02
    labels:
      # Backup: torrent state and settings are plain files.
      homelab.backup: "none"
      glance.name: "qBittorrent"
      glance.icon: "sh:qbittorrent"
      glance.description: "Torrent Client"
      glance.category: "media"
      glance.url: "https://qbittorrent.${PROXY_DOMAIN}"
    ports:
      - "8080:8080"
      - "8118:8118"
    restart: unless-stopped
    logging: *logging
    cap_add:
      - NET_ADMIN
    volumes:
      - ${DOCKERCONFDIR}/qbittorrent:/config:rw
      # /downloads, not /data as the image suggests: the save path of the torrents moved from Deluge.
      - ${DOCKERSTORAGEDIR}/torrents:/downloads
    environment:
      VPN_ENABLED: ${VPN_ENABLED}
      VPN_USER: ${VPN_USER}
      VPN_PASS: ${VPN_PASS}
      VPN_PROV: ${VPN_PROV}
      VPN_CLIENT: ${VPN_CLIENT}
      STRICT_PORT_FORWARD: ${STRICT_PORT_FORWARD}
      ENABLE_PRIVOXY: ${ENABLE_PRIVOXY}
      # The web UI rejects requests when this differs from the published port.
      WEBUI_PORT: 8080
      PUID: ${PUID}
      PGID: ${PGID}
      VPN_OPTIONS: ${VPN_OPTIONS}
      LAN_NETWORK: ${LAN_NETWORK}
      NAME_SERVERS: ${NAME_SERVERS}

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162
    logging: *logging
    restart: unless-stopped
    dns:
      - 194.242.2.2
      - 5.1.66.255
    network_mode: host
    labels:
      # Backup: its data lives in prowlarr-postgres.
      homelab.backup: "none"
      glance.name: "Prowlarr"
      glance.id: "prowlarr"
      glance.icon: "sh:prowlarr"
      glance.description: "Indexer Manager"
      glance.category: "media"
      glance.url: "https://prowlarr.${PROXY_DOMAIN}"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/prowlarr:/config:rw
      - ../../config/prowlarr/mods:/custom-cont-init.d:ro

  prowlarr-postgres:
    container_name: prowlarr-postgres
    image: postgres:14.24
    restart: unless-stopped
    logging: *logging
    network_mode: host
    # Host network: without listen_addresses, Postgres would take connections from the whole LAN.
    command: -p 5433 -c listen_addresses=localhost
    labels:
      homelab.backup: "postgres"
      glance.name: "Prowlarr PostgreSQL"
      glance.icon: "sh:postgresql"
      glance.description: "Prowlarr Database"
      glance.category: "media"
      glance.parent: "prowlarr"
    environment:
      - POSTGRES_USER=prowlarr
      - POSTGRES_PASSWORD=${PROWLARR_DB_PASSWORD}
      - POSTGRES_DB=prowlarr-main
      - TZ=${TZ}
      - PGPORT=5433
    volumes:
      - ${DOCKERCONFDIR}/prowlarr-postgres:/var/lib/postgresql/data

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    labels:
      homelab.backup: "sqlite"
      glance.name: "Sonarr"
      glance.icon: "sh:sonarr"
      glance.description: "TV Show Management"
      glance.category: "media"
      glance.url: "https://sonarr.${PROXY_DOMAIN}"
    restart: unless-stopped
    network_mode: host
    logging: *logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/sonarr:/config
      - ${DOCKERSTORAGEDIR}:/data

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls319
    labels:
      homelab.backup: "sqlite"
      glance.name: "Radarr"
      glance.icon: "sh:radarr"
      glance.description: "Movie Management"
      glance.category: "media"
      glance.url: "https://radarr.${PROXY_DOMAIN}"
    restart: unless-stopped
    logging: *logging
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/radarr:/config
      - ${DOCKERSTORAGEDIR}:/data

  plex-server:
    container_name: plex-server
    image: plexinc/pms-docker:1.43.4.10903-e5521bd8c
    restart: unless-stopped
    labels:
      # Backup: Plex's databases need Plex's own SQLite (ICU collation, full-text tokenizer) to be checked.
      homelab.backup: "sqlite-unchecked"
      glance.name: "Plex"
      glance.icon: "sh:plex"
      glance.description: "Media Server"
      glance.category: "media"
      glance.url: "https://plex.${PROXY_DOMAIN}"
    logging: *logging
    environment:
      - TZ=${TZ}
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/plex:/config:rw
      - ${DOCKERSTORAGEDIR}/media:/data/media:rw
    # Intel Quick Sync hardware transcoding (needs Plex Pass).
    devices:
      - /dev/dri:/dev/dri

  # A second media server over the same library as Plex: users, watch history and metadata
  # are its own.
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    labels:
      homelab.backup: "sqlite"
      glance.name: "Jellyfin"
      glance.icon: "sh:jellyfin"
      glance.description: "Media Server"
      glance.category: "media"
      glance.url: "https://jellyfin.${PROXY_DOMAIN}"
    logging: *logging
    environment:
      - TZ=${TZ}
    ports:
      - "8096:8096"
    volumes:
      - ${DOCKERCONFDIR}/jellyfin/config:/config:rw
      - ${DOCKERCONFDIR}/jellyfin/cache:/cache:rw
      # Read-only, under the path Plex sees it at: this server never changes the library.
      - ${DOCKERSTORAGEDIR}/media:/data/media:ro
    # Intel Quick Sync hardware transcoding, to turn on in Dashboard > Playback > Transcoding.
    # The image's default user, root, is kept: DSM leaves /dev/dri to root only.
    devices:
      - /dev/dri:/dev/dri

  notifiarr:
    container_name: notifiarr
    labels:
      # Backup: a settings file only.
      homelab.backup: "none"
      glance.name: "Notifiarr"
      glance.icon: "sh:notifiarr"
      glance.description: "Notifications"
      glance.category: "media"
    network_mode: host
    image: golift/notifiarr:0.9.7
    restart: unless-stopped
    logging: *logging
    volumes:
      - ${DOCKERCONFDIR}/notifiarr:/config

  # Applies config/configarr/config.yml to Sonarr and Radarr: the TRaSH Guides quality profiles
  # listed there, with their custom formats and scores. It runs once and exits, three ways: when
  # this stack is deployed, when the deploy restarts it after a change to its config, and every
  # day from DSM Task Scheduler (`docker start -a configarr`), which brings in the guides' updates.
  configarr:
    container_name: configarr
    image: ghcr.io/raydak-labs/configarr:1.34.0
    user: "${PUID}:${PGID}"
    network_mode: host
    labels:
      glance.name: "Configarr"
      glance.icon: "sh:configarr"
      glance.description: "TRaSH Guides sync, runs daily"
      glance.category: "media"
    restart: "no"
    logging: *logging
    environment:
      - TZ=${TZ}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      # Without these two, a failed sync or an unknown profile id is a log line and exit code 0:
      # nobody would be told.
      - STOP_ON_ERROR=true
      - CONFIGARR_ENFORCE_CONFIG_VALIDATION=true
    volumes:
      - ../../config/configarr:/app/config:ro
    # Its copy of the guides is cloned again on every run, into memory: kept on disk, a clone cut
    # short by a restart makes every later run fail.
    tmpfs:
      - /app/repos:uid=${PUID},gid=${PGID}
