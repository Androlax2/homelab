x-logging: &logging
  driver: json-file
  options:
    max-file: ${DOCKERLOGGING_MAXFILE}
    max-size: ${DOCKERLOGGING_MAXSIZE}

services:

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.29.0
    container_name: maintainerr
    user: "${PUID}:${PGID}"
    network_mode: host
    labels:
      homelab.backup: "sqlite"
      glance.name: "Maintainerr"
      glance.icon: "sh:maintainerr"
      glance.description: "Maintainerr"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:6246"
    logging: *logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/maintainerr:/opt/data
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.18.1-ls244
    labels:
      homelab.backup: "sqlite"
      glance.name: "Tautulli"
      glance.icon: "sh:tautulli"
      glance.description: "Plex Analytics"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:8181"
    container_name: tautulli
    network_mode: host
    logging: *logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/tautulli:/config
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    user: "${PUID}:${PGID}"
    labels:
      homelab.backup: "sqlite"
      glance.name: "Seerr"
      glance.icon: "sh:overseerr"
      glance.description: "Media Requests"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:5055"
    container_name: seerr
    network_mode: host
    logging: *logging
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/seerr:/app/config
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  deluge:
    container_name: deluge
    image: binhex/arch-delugevpn:2.2.0-1-04
    labels:
      # Backup: torrent state and settings are plain files.
      homelab.backup: "none"
      glance.name: "Deluge"
      glance.icon: "sh:deluge"
      glance.description: "Torrent Client"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:8112"
    ports:
      - "8112:8112"
      - "8118:8118"
      - "58846:58846"
      - "58946:58946"
    restart: unless-stopped
    logging: *logging
    cap_add:
      - NET_ADMIN
    volumes:
      - ${DOCKERCONFDIR}/deluge:/config:rw
      - ${DOCKERSTORAGEDIR}/torrents:/downloads
    environment:
      VPN_ENABLED: ${VPN_ENABLED}
      VPN_USER: ${VPN_USER}
      VPN_PASS: ${VPN_PASS}
      VPN_PROV: ${VPN_PROV}
      VPN_CLIENT: ${VPN_CLIENT}
      STRICT_PORT_FORWARD: ${STRICT_PORT_FORWARD}
      ENABLE_PRIVOXY: ${ENABLE_PRIVOXY}
      DELUGE_DAEMON_LOG_LEVEL: ${DELUGE_DAEMON_LOG_LEVEL}
      DELUGE_WEB_LOG_LEVEL: ${DELUGE_WEB_LOG_LEVEL}
      PUID: ${PUID}
      PGID: ${PGID}
      VPN_OPTIONS: ${VPN_OPTIONS}
      LAN_NETWORK: ${LAN_NETWORK}
      NAME_SERVERS: ${NAME_SERVERS}

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls161
    logging: *logging
    restart: unless-stopped
    dns:
      - 194.242.2.2
      - 5.1.66.255
    network_mode: host
    labels:
      # Backup: its data lives in prowlarr-postgres.
      homelab.backup: "none"
      glance.name: "Prowlarr"
      glance.id: "prowlarr"
      glance.icon: "sh:prowlarr"
      glance.description: "Indexer Manager"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/prowlarr:/config:rw
      - ../../config/prowlarr/mods:/custom-cont-init.d:ro

  prowlarr-postgres:
    container_name: prowlarr-postgres
    image: postgres:14.24
    restart: unless-stopped
    logging: *logging
    network_mode: host
    # Host network: without listen_addresses, Postgres would take connections from the whole LAN.
    command: -p 5433 -c listen_addresses=localhost
    labels:
      homelab.backup: "postgres"
      glance.name: "Prowlarr PostgreSQL"
      glance.icon: "sh:postgresql"
      glance.description: "Prowlarr Database"
      glance.category: "media"
      glance.parent: "prowlarr"
    environment:
      - POSTGRES_USER=prowlarr
      - POSTGRES_PASSWORD=${PROWLARR_DB_PASSWORD}
      - POSTGRES_DB=prowlarr-main
      - TZ=${TZ}
      - PGPORT=5433
    volumes:
      - ${DOCKERCONFDIR}/prowlarr-postgres:/var/lib/postgresql/data

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
    labels:
      homelab.backup: "sqlite"
      glance.name: "Sonarr"
      glance.icon: "sh:sonarr"
      glance.description: "TV Show Management"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:8989"
    restart: unless-stopped
    network_mode: host
    logging: *logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/sonarr:/config
      - ${DOCKERSTORAGEDIR}:/data

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls317
    labels:
      homelab.backup: "sqlite"
      glance.name: "Radarr"
      glance.icon: "sh:radarr"
      glance.description: "Movie Management"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:7878"
    restart: unless-stopped
    logging: *logging
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/radarr:/config
      - ${DOCKERSTORAGEDIR}:/data

  plex-server:
    container_name: plex-server
    image: plexinc/pms-docker:1.43.4.10903-e5521bd8c
    restart: unless-stopped
    labels:
      # Backup: Plex's databases need Plex's own SQLite (ICU collation, full-text tokenizer) to be checked.
      homelab.backup: "sqlite-unchecked"
      glance.name: "Plex"
      glance.icon: "sh:plex"
      glance.description: "Media Server"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:32400"
    logging: *logging
    environment:
      - TZ=${TZ}
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/plex:/config:rw
      - ${DOCKERSTORAGEDIR}/media:/data/media:rw
    # Intel Quick Sync hardware transcoding (needs Plex Pass).
    devices:
      - /dev/dri:/dev/dri

  notifiarr:
    container_name: notifiarr
    labels:
      # Backup: a settings file only.
      homelab.backup: "none"
      glance.name: "Notifiarr"
      glance.icon: "sh:notifiarr"
      glance.description: "Notifications"
      glance.category: "media"
    network_mode: host
    image: golift/notifiarr:0.9.7
    restart: unless-stopped
    logging: *logging
    volumes:
      - ${DOCKERCONFDIR}/notifiarr:/config

  # Applies config/recyclarr/ to Sonarr and Radarr, but only when scripts/sync_arr_settings.sh
  # runs `recyclarr sync` in it: on its own the container just waits, so it never overwrites a
  # change made in the apps before the sync has sent it to the repo.
  recyclarr:
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:8.7.2
    entrypoint: ["/sbin/tini", "--", "sh", "-c", "while true; do sleep 3600; done"]
    user: "${PUID}:${PGID}"
    network_mode: host
    labels:
      # Backup: its settings are in this repo, the folder only holds cache and state.
      homelab.backup: "none"
      glance.name: "Recyclarr"
      glance.icon: "sh:recyclarr"
      glance.description: "Sonarr/Radarr settings sync"
      glance.category: "media"
    restart: unless-stopped
    logging: *logging
    environment:
      - TZ=${TZ}
      - SONARR_BASE_URL=http://localhost:8989
      - RADARR_BASE_URL=http://localhost:7878
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
    volumes:
      # Writable state; the declared settings come from the repo, read-only.
      - ${DOCKERCONFDIR}/recyclarr:/config
      - ../../config/recyclarr/configs:/config/configs:ro
      - ../../config/recyclarr/settings.yml:/config/settings.yml:ro
      - ../../config/recyclarr/custom-formats:/config/custom-formats:ro
