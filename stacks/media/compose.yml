services:

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    user: "${PUID}:${PGID}"
    network_mode: host
    labels:
      glance.name: "Maintainerr"
      glance.icon: "sh:maintainerr"
      glance.description: "Maintainerr"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:6246"
    environment:
      - TZ=${TZ}
    volumes:
      - ${DOCKERCONFDIR}/maintainerr:/opt/data
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    labels:
      glance.name: "Tautulli"
      glance.icon: "sh:tautulli"
      glance.description: "Plex Analytics"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:8181"
    container_name: tautulli
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - ${DOCKERCONFDIR}/tautulli:/config
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "${PUID}:${PGID}"
    labels:
      glance.name: "Seerr"
      glance.icon: "sh:overseerr"
      glance.description: "Media Requests"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:5055"
    container_name: seerr
    network_mode: host
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - ${DOCKERCONFDIR}/seerr:/app/config
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  deluge:
    container_name: deluge
    image: binhex/arch-delugevpn
    labels:
      glance.name: "Deluge"
      glance.icon: "sh:deluge"
      glance.description: "Torrent Client"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:8112"
    ports:
      - "8112:8112"
      - "8118:8118"
      - "58846:58846"
      - "58946:58946"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    volumes:
      - ${DOCKERCONFDIR}/deluge:/config:rw
      - ${DOCKERSTORAGEDIR}/torrents:/downloads
    environment:
      VPN_ENABLED: ${VPN_ENABLED}
      VPN_USER: ${VPN_USER}
      VPN_PASS: ${VPN_PASS}
      VPN_PROV: ${VPN_PROV}
      VPN_CLIENT: ${VPN_CLIENT}
      STRICT_PORT_FORWARD: ${STRICT_PORT_FORWARD}
      ENABLE_PRIVOXY: ${ENABLE_PRIVOXY}
      DELUGE_DAEMON_LOG_LEVEL: ${DELUGE_DAEMON_LOG_LEVEL}
      DELUGE_WEB_LOG_LEVEL: ${DELUGE_WEB_LOG_LEVEL}
      PUID: ${PUID}
      PGID: ${PGID}
      VPN_OPTIONS: ${VPN_OPTIONS}
      LAN_NETWORK: ${LAN_NETWORK}
      NAME_SERVERS: ${NAME_SERVERS}

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    restart: unless-stopped
    dns:
      - 194.242.2.2
      - 5.1.66.255
    network_mode: host
    labels:
      glance.name: "Prowlarr"
      glance.id: "prowlarr"
      glance.icon: "sh:prowlarr"
      glance.description: "Indexer Manager"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:9696"
    environment:
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - TZ=${TZ} # timezone, defined in .env
    volumes:
      - ${DOCKERCONFDIR}/prowlarr:/config:rw
      - ${DOCKERCONFDIR}/prowlarr/mods:/custom-cont-init.d:ro

  prowlarr-postgres:
    container_name: prowlarr-postgres
    image: postgres:14
    restart: unless-stopped
    network_mode: host
    command: -p 5433
    labels:
      glance.name: "Prowlarr PostgreSQL"
      glance.icon: "sh:postgresql"
      glance.description: "Prowlarr Database"
      glance.category: "media"
      glance.parent: "prowlarr"
    environment:
      - POSTGRES_USER=prowlarr
      - POSTGRES_PASSWORD=${PROWLARR_DB_PASSWORD}
      - POSTGRES_DB=prowlarr-main
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PGPORT=5433
    volumes:
      - ${DOCKERCONFDIR}/prowlarr-postgres:/var/lib/postgresql/data

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    labels:
      glance.name: "Sonarr"
      glance.icon: "sh:sonarr"
      glance.description: "TV Show Management"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:8989"
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/sonarr:/config
      - ${DOCKERSTORAGEDIR}:/data

  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    labels:
      glance.name: "Radarr" 
      glance.icon: "sh:radarr"
      glance.description: "Movie Management"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:7878"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/radarr:/config
      - ${DOCKERSTORAGEDIR}:/data

  plex-server:
    container_name: plex-server
    image: plexinc/pms-docker:latest
    restart: unless-stopped
    labels:
      glance.name: "Plex"
      glance.icon: "sh:plex"
      glance.description: "Media Server"
      glance.category: "media"
      glance.url: "http://${LAN_IP}:32400"
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    environment:
      - TZ=${TZ} # timezone, defined in .env
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKERCONFDIR}/plex:/config:rw
      - ${DOCKERSTORAGEDIR}/media:/data/media:rw
    devices: # optional: if you have a Syno with an Intel CPU with quicksync and want hardware transcoding (only with Plex Pass) uncomment this line.
      - /dev/dri:/dev/dri # optional: if you have a Syno with an Intel CPU with quicksync and want hardware transcoding (only with Plex Pass) uncomment this line.

  notifiarr:
    container_name: notifiarr
    labels:
      glance.name: "Notifiarr"
      glance.icon: "sh:notifiarr"
      glance.description: "Notifications"
      glance.category: "media"
    network_mode: host
    image: golift/notifiarr
    restart: unless-stopped
    volumes:
      - ${DOCKERCONFDIR}/notifiarr:/config
