name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check_stacks.sh

  glance-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check_glance_config.sh

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Syntax
        run: |
          for script in scripts/*.sh scripts/tests/*.sh config/prowlarr/mods/*.sh operations/*.sh; do
            [ -e "$script" ] || continue
            bash -n "$script"
          done
      - name: Tests
        run: |
          for test_file in scripts/tests/*_test.sh; do
            echo "== $test_file"
            bash "$test_file"
          done

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The NAS's settings sync pushes with its own token: its pull requests may only touch config/recyclarr/.
      - name: Settings-sync pull requests only change config/recyclarr
        if: github.head_ref == 'arr-settings-sync'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          outside=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -v '^config/recyclarr/' || true)
          if [ -n "$outside" ]; then
            echo "This pull request comes from the NAS settings sync and may only change config/recyclarr/:"
            echo "$outside"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
