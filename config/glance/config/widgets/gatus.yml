# What Gatus last saw of the checks in config/gatus/config.yaml, read on the stack's network:
# its API asks for no login. A check that has no result yet counts as neither up nor down.
- type: custom-api
  title: Uptime
  title-url: https://gatus.${PROXY_DOMAIN}
  cache: 1m
  url: http://gatus:8080/api/v1/endpoints/statuses
  template: |
    {{ if ne .Response.StatusCode 200 }}
      <p class="color-negative">Gatus: {{ .Response.Status }}</p>
    {{ else }}
      {{ $endpoints := .JSON.Array "" }}
      {{ $upCount := 0 }}
      {{ $downCount := 0 }}
      {{ range $endpoints }}
        {{ $results := .Array "results" }}
        {{ if gt (len $results) 0 }}
          {{ if (index $results (sub (len $results) 1)).Bool "success" }}
            {{ $upCount = add $upCount 1 }}
          {{ else }}
            {{ $downCount = add $downCount 1 }}
          {{ end }}
        {{ end }}
      {{ end }}
      <div class="flex justify-between text-center">
        <div>
            <div class="color-highlight size-h3">{{ $upCount }}</div>
            <div class="size-h6">UP</div>
        </div>
        <div>
            <div class="size-h3 {{ if gt $downCount 0 }}color-negative{{ else }}color-highlight{{ end }}">{{ $downCount }}</div>
            <div class="size-h6">DOWN</div>
        </div>
        <div>
            <div class="color-highlight size-h3">{{ len $endpoints }}</div>
            <div class="size-h6">CHECKS</div>
        </div>
      </div>
      {{ if gt $downCount 0 }}
        <ul class="list list-gap-10 margin-top-10">
          {{ range $endpoints }}
            {{ $results := .Array "results" }}
            {{ if gt (len $results) 0 }}
              {{ $lastResult := index $results (sub (len $results) 1) }}
              {{ if not ($lastResult.Bool "success") }}
                <li class="flex justify-between items-center">
                  <span class="color-negative">{{ .String "name" }}</span>
                  <span class="size-h6">
                    {{ if gt ($lastResult.Int "status") 0 }}HTTP {{ $lastResult.Int "status" }}{{ else }}no answer{{ end }}
                  </span>
                </li>
              {{ end }}
            {{ end }}
          {{ end }}
        </ul>
      {{ end }}
    {{ end }}
