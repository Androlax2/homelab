# Every router names its entrypoint, inline: `tailnet` is reachable from the tailnet only,
# `public` from the internet. scripts/check_proxy_routes.sh (CI) allows `public` only for the
# routers it lists.
#
# Backends are the ports the stacks already publish on the NAS, or the app's own port for
# the containers on the host network.
http:
  routers:
    vaultwarden:
      entryPoints: [tailnet]
      rule: 'Host(`vault.{{ env "PROXY_DOMAIN" }}`)'
      service: vaultwarden
    opusline:
      entryPoints: [tailnet]
      rule: 'Host(`opusline.{{ env "PROXY_DOMAIN" }}`)'
      service: opusline
    plex:
      entryPoints: [public]
      rule: 'Host(`plex.{{ env "PROXY_DOMAIN" }}`)'
      service: plex
    glance:
      entryPoints: [tailnet]
      rule: 'Host(`glance.{{ env "PROXY_DOMAIN" }}`)'
      service: glance
    filebrowser:
      entryPoints: [tailnet]
      rule: 'Host(`filebrowser.{{ env "PROXY_DOMAIN" }}`)'
      service: filebrowser
    dozzle:
      entryPoints: [tailnet]
      rule: 'Host(`dozzle.{{ env "PROXY_DOMAIN" }}`)'
      service: dozzle
    beszel:
      entryPoints: [tailnet]
      rule: 'Host(`beszel.{{ env "PROXY_DOMAIN" }}`)'
      service: beszel
    gatus:
      entryPoints: [tailnet]
      rule: 'Host(`gatus.{{ env "PROXY_DOMAIN" }}`)'
      service: gatus
    immich:
      entryPoints: [tailnet]
      rule: 'Host(`immich.{{ env "PROXY_DOMAIN" }}`)'
      service: immich
    seerr:
      entryPoints: [tailnet]
      rule: 'Host(`seerr.{{ env "PROXY_DOMAIN" }}`)'
      service: seerr
    sonarr:
      entryPoints: [tailnet]
      rule: 'Host(`sonarr.{{ env "PROXY_DOMAIN" }}`)'
      service: sonarr
    radarr:
      entryPoints: [tailnet]
      rule: 'Host(`radarr.{{ env "PROXY_DOMAIN" }}`)'
      service: radarr
    prowlarr:
      entryPoints: [tailnet]
      rule: 'Host(`prowlarr.{{ env "PROXY_DOMAIN" }}`)'
      service: prowlarr
    qbittorrent:
      entryPoints: [tailnet]
      rule: 'Host(`qbittorrent.{{ env "PROXY_DOMAIN" }}`)'
      service: qbittorrent
    tautulli:
      entryPoints: [tailnet]
      rule: 'Host(`tautulli.{{ env "PROXY_DOMAIN" }}`)'
      service: tautulli
    maintainerr:
      entryPoints: [tailnet]
      rule: 'Host(`maintainerr.{{ env "PROXY_DOMAIN" }}`)'
      service: maintainerr
    notifiarr:
      entryPoints: [tailnet]
      rule: 'Host(`notifiarr.{{ env "PROXY_DOMAIN" }}`)'
      service: notifiarr
    jellyfin:
      entryPoints: [public]
      rule: 'Host(`jellyfin.{{ env "PROXY_DOMAIN" }}`)'
      service: jellyfin
    matrix:
      entryPoints: [tailnet]
      rule: 'Host(`matrix.{{ env "PROXY_DOMAIN" }}`)'
      service: matrix
    adguard:
      entryPoints: [tailnet]
      rule: 'Host(`adguard.{{ env "PROXY_DOMAIN" }}`)'
      service: adguard
    paperless:
      entryPoints: [tailnet]
      rule: 'Host(`paperless.{{ env "PROXY_DOMAIN" }}`)'
      service: paperless

  services:
    vaultwarden:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8580'
    opusline:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:{{ env "OPUSLINE_PORT" }}'
    plex:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:32400'
    glance:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8090'
    filebrowser:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8095'
    dozzle:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8097'
    beszel:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8098'
    gatus:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8099'
    immich:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:2283'
    seerr:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:5055'
    sonarr:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8989'
    radarr:
      loadBalancer:
        servers:
