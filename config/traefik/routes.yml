    notifiarr:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:5454'
    jellyfin:
      loadBalancer:
        servers:
          - url: 'http://{{ env "LAN_IP" }}:8096'
    matrix:
      loadBalancer:
