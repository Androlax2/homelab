# Synapse, for a handful of people on the tailnet. Nothing here is secret or tied to the
# domain: server_name, public_baseurl and the database (with its password) are in
# /data/local.yaml, written once on the server by
# operations/2026_10_10_153832_prepare_the_matrix_stack.before.sh.

listeners:
  # Plain HTTP: Traefik serves the TLS (config/traefik/routes.yml).
  - port: 8008
    type: http
    tls: false
    # Traefik passes the device's address in X-Forwarded-For.
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      # `client` also serves the media. No `federation`: other homeservers can't talk to this one.
      - names: [client]
        compress: false

# No federation the other way either: this server contacts no other homeserver, and asks
# none for signing keys (the default is matrix.org).
federation_domain_whitelist: []
trusted_key_servers: []

report_stats: false

# Nobody signs up from an app. Accounts are created on the server, see the README.
enable_registration: false
# What `register_new_matrix_user` proves itself with. Synapse creates the file.
registration_shared_secret_path: /data/registration_shared_secret

signing_key_path: /data/signing.key
media_store_path: /data/media_store
max_upload_size: 100M

log_config: /config/log.yaml
